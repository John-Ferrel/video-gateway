<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Video Gateway v1.0 architecture</title>
  <desc id="desc">Browser or API client connects through optional Cloudflare Access to a FastAPI gateway on loopback. The gateway stores jobs in SQLite, normalizes media with FFmpeg, and calls one scale-to-zero Modal worker on an RTX PRO 6000. The worker reads FastH3 weights from Modal Volumes and writes result MP4s.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d12"/>
      <stop offset="0.55" stop-color="#0d1118"/>
      <stop offset="1" stop-color="#0a0f14"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8ff8cf"/>
      <stop offset="1" stop-color="#4ee0aa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c8ba1"/>
    </marker>
    <marker id="arrow-mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7cf5c4"/>
    </marker>
    <style>
      .bg { fill: url(#bg); }
      .panel { fill: #12161f; stroke: #27303f; stroke-width: 1.2; }
      .panel-soft { fill: #0f141c; stroke: #222b39; stroke-width: 1.2; }
      .title { fill: #f2f6fb; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
      .subtitle { fill: #8c99ac; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; }
      .h { fill: #edf3fa; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 17px; font-weight: 650; }
      .label { fill: #8f9db0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
      .body { fill: #aeb9c8; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12.5px; }
      .mono { fill: #c5d0df; font-family: "SFMono-Regular", ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; }
      .accent { fill: #7cf5c4; }
      .violet { fill: #b7a4ff; }
      .amber { fill: #f5c97c; }
      .line { stroke: #7c8ba1; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .line-mint { stroke: #7cf5c4; stroke-width: 1.7; fill: none; marker-end: url(#arrow-mint); }
      .line-dashed { stroke: #66758a; stroke-width: 1.3; stroke-dasharray: 5 6; fill: none; }
      .badge { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.04em; }
      .dot { fill: #7cf5c4; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="640" rx="20"/>
  <circle cx="1035" cy="55" r="170" fill="#4ee0aa" opacity="0.055" filter="url(#glow)"/>
  <circle cx="145" cy="600" r="150" fill="#b7a4ff" opacity="0.035" filter="url(#glow)"/>

  <text x="48" y="58" class="title">Video Gateway <tspan class="accent">v1.0</tspan></text>
  <text x="48" y="82" class="subtitle">One warm GPU, scale-to-zero, guarded by a monthly budget.</text>
  <g transform="translate(900 36)">
    <rect x="0" y="0" width="252" height="30" rx="15" fill="#0f2a22" stroke="#2b6a56"/>
    <circle cx="17" cy="15" r="4" class="dot"/>
    <text x="30" y="19" class="badge" fill="#a7f3d4">GATEWAY BINDS LOOPBACK</text>
  </g>

  <!-- browser -->
  <g filter="url(#shadow)">
    <rect x="48" y="128" width="200" height="132" rx="14" class="panel"/>
  </g>
  <text x="70" y="157" class="label">Clients</text>
  <text x="70" y="184" class="h">Browser / API</text>
  <text x="70" y="207" class="body">Studio, Batch, Library</text>
  <text x="70" y="225" class="body">curl, Python, agents</text>
  <rect x="70" y="238" width="152" height="1" fill="#27303f"/>
  <text x="70" y="252" class="mono">Bearer vg_…</text>

  <!-- access -->
  <g filter="url(#shadow)">
    <rect x="296" y="128" width="176" height="132" rx="14" class="panel-soft" stroke-dasharray="5 5"/>
  </g>
  <text x="318" y="157" class="label">Optional edge</text>
  <text x="318" y="184" class="h">Cloudflare</text>
  <text x="318" y="204" class="body">Tunnel + Access</text>
  <text x="318" y="222" class="body">browser session or</text>
  <text x="318" y="240" class="body">service token</text>

  <!-- gateway -->
  <g filter="url(#shadow)">
    <rect x="524" y="112" width="344" height="300" rx="16" class="panel"/>
  </g>
  <rect x="524" y="112" width="6" height="300" rx="3" fill="url(#mint)"/>
  <text x="550" y="143" class="label">Gateway host</text>
  <text x="550" y="172" class="h">FastAPI gateway</text>
  <text x="550" y="194" class="mono">127.0.0.1:8787</text>
  <rect x="550" y="210" width="292" height="1" fill="#27303f"/>
  <g class="body">
    <text x="550" y="234">• Bearer auth · constant-time compare</text>
    <text x="550" y="256">• upload validation · rate limiting</text>
    <text x="550" y="278">• SQLite WAL jobs + budget ledger</text>
    <text x="550" y="300">• single dispatcher · FIFO · no retries</text>
    <text x="550" y="322">• FFmpeg normalize + poster</text>
    <text x="550" y="344">• Studio / Batch / Library / Usage</text>
  </g>
  <g transform="translate(550 366)">
    <rect width="164" height="28" rx="8" fill="#10251f" stroke="#2b6a56"/>
    <text x="12" y="18" class="badge" fill="#a7f3d4">BUDGET GUARD · $28 SOFT</text>
  </g>

  <!-- worker -->
  <g filter="url(#shadow)">
    <rect x="912" y="112" width="240" height="300" rx="16" class="panel"/>
  </g>
  <rect x="912" y="112" width="6" height="300" rx="3" fill="#b7a4ff"/>
  <text x="938" y="143" class="label">Serverless GPU</text>
  <text x="938" y="172" class="h">Modal worker</text>
  <text x="938" y="194" class="mono">RTX PRO 6000 · 96 GiB</text>
  <rect x="938" y="210" width="188" height="1" fill="#27303f"/>
  <g class="body">
    <text x="938" y="234">• max 1 container</text>
    <text x="938" y="256">• 10 s scale-to-zero</text>
    <text x="938" y="278">• FastVideo runtime</text>
    <text x="938" y="300">• FastH3 V2 / OmniRef</text>
    <text x="938" y="322">• native audio · full VAE</text>
    <text x="938" y="344">• retries = 0</text>
  </g>
  <g transform="translate(938 366)">
    <rect width="132" height="28" rx="8" fill="#241f36" stroke="#584b85"/>
    <text x="12" y="18" class="badge" fill="#cbbdff">V2 COLD LOAD ~26 s</text>
  </g>

  <!-- local state -->
  <g filter="url(#shadow)">
    <rect x="524" y="446" width="344" height="142" rx="14" class="panel-soft"/>
  </g>
  <text x="550" y="474" class="label">Local state</text>
  <text x="550" y="498" class="h">SQLite + media</text>
  <text x="550" y="520" class="mono">data/gateway.db</text>
  <text x="550" y="540" class="mono">data/{uploads,outputs,thumbs}</text>
  <text x="550" y="564" class="body">30-day retention · 20 GB storage cap</text>

  <!-- modal volumes -->
  <g filter="url(#shadow)">
    <rect x="912" y="446" width="240" height="142" rx="14" class="panel-soft"/>
  </g>
  <text x="938" y="474" class="label">Modal Volumes</text>
  <text x="938" y="498" class="h">Weights + results</text>
  <text x="938" y="520" class="mono">V2 / OmniRef / Trim</text>
  <text x="938" y="540" class="mono">models 63 · 109 · 35 GB</text>
  <text x="938" y="564" class="body">cache · prompt embeds · results</text>

  <!-- arrows -->
  <path d="M 248 194 L 288 194" class="line"/>
  <path d="M 472 194 L 516 194" class="line"/>
  <path d="M 868 240 L 904 240" class="line-mint"/>
  <path d="M 1032 412 L 1032 438" class="line"/>
  <path d="M 696 412 L 696 438" class="line"/>

  <text x="251" y="184" class="body" font-size="10">HTTPS</text>
  <text x="480" y="184" class="body" font-size="10">token</text>
  <text x="886" y="220" class="body" font-size="10" text-anchor="middle">spawn</text>
  <text x="886" y="232" class="body" font-size="10" text-anchor="middle">poll</text>
  <text x="1042" y="429" class="body" font-size="10">read / write</text>
  <text x="704" y="429" class="body" font-size="10">read / write</text>

  <!-- footer note -->
  <text x="48" y="616" class="subtitle">Browser media URLs use short-lived HMAC tokens. The gateway key never appears in a media URL. Remote reference fetching is disabled by default.</text>
</svg>
