services:
  gateway:
    build: .
    container_name: video-gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      HOST: 0.0.0.0
      PORT: "8787"
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
